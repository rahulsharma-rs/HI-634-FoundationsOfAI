name: Verify teaching notebooks

on:
  push:
  pull_request:

jobs:
  execute-course-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify environment
        run: python scripts/verify_install.py
      - name: Regenerate weekly synthetic data
        run: python scripts/generate_week_data.py
      - name: Execute all weekly notebooks
        run: python scripts/execute_notebooks.py
